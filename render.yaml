services:
  - type: web
    name: proofstack-app
    env: python
    plan: free
    buildCommand: "cd src && pip install -r requirements.txt"
    startCommand: "cd src && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: FLASK_ENV
        value: production
