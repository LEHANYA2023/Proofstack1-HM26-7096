<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProofStack — AI Interview</title>
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">ProofStack</span>
  </div>
  <p class="brand-tag">AI pre-screens. Humans decide.</p>
</header>

<div class="container">
  <div class="card glow">
    <h2>Live AI Interview</h2>
    <p class="muted">
      The AI asks you about your own submission — architecture choices, bugs you hit,
      trade-offs you made. It never issues a pass/fail verdict; a human reviewer reads the
      transcript alongside your rubric score.
    </p>
    <div class="filters">
      <input id="submission_id" placeholder="Submission ID" />
      <button class="btn-primary" onclick="startInterview()">Start interview</button>
    </div>
    <div id="transcript" class="transcript"></div>
    <div class="filters" id="respond-row" style="display:none">
      <input id="answer" placeholder="Type your answer…" />
      <button class="btn-primary" onclick="sendAnswer()">Send</button>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem("proofstack_token") || "";
let SESSION_ID = "";

function renderTranscript(t) {
  const el = document.getElementById("transcript");
  el.innerHTML = t.transcript.map(turn => `
    <div class="turn ${turn.role}">
      <span class="role">${turn.role === "interviewer" ? "🤖 AI" : "🧑 You"}</span>
      <p>${turn.content}</p>
    </div>`).join("");
  document.getElementById("respond-row").style.display =
    t.status === "in_progress" ? "flex" : "none";
}

async function startInterview() {
  const submissionId = document.getElementById("submission_id").value;
  const res = await fetch(`/api/interview/${submissionId}/start`, {
    method: "POST",
    headers: { Authorization: `Bearer ${TOKEN}` },
  });
  const data = await res.json();
  if (!res.ok) return alert(data.error || "Could not start interview");
  SESSION_ID = data.id;
  renderTranscript(data);
}

async function sendAnswer() {
  const message = document.getElementById("answer").value;
  const res = await fetch(`/api/interview/${SESSION_ID}/respond`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${TOKEN}` },
    body: JSON.stringify({ message }),
  });
  const data = await res.json();
  document.getElementById("answer").value = "";
  renderTranscript(data);
}
</script>
</body>
</html>
